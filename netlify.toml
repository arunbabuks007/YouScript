[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set VITE_SITE_URL in Netlify (Site settings -> Environment variables) to this site's real address, e.g.
  # https://youscript-ytscript.netlify.app — it feeds canonical links, the sitemap and social previews.

# Every page is pre-rendered to its own HTML file, so there is deliberately NO catch-all rewrite to
# index.html: an unknown address gets the real 404.html (and a 404 status), which is what search engines want.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
